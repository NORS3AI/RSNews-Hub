name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI uses a throwaway SQLite file; no real secrets are needed to lint,
      # test, or type-check. AUTH_SECRET falls back to a dev value in code.
      # DATABASE_URL: "file:./ci.db"
      ### Updating to use disposable posgresql service for db update on demo
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/rsnews_ci?schema=public"

    services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: rsnews_ci
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U postgres -d rsnews_ci"
            --health-interval 5s
            --health-timeout 5s
            --health-retries 12
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (current LTS). Required by jsdom 30 → undici 8, which uses
          # worker_threads.markAsUncloneable (added in Node 22); on Node 20 the
          # test run aborts with "webidl.util.markAsUncloneable is not a function"
          # even though every test passes.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Create CI database
        run: npx prisma db push --skip-generate

      - name: Type-check
        run: npm run typecheck

      - name: Unit & API tests
        run: npm test

      - name: Build
        run: npm run build
