name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI uses a throwaway SQLite file; no real secrets are needed to lint,
      # test, or type-check. AUTH_SECRET falls back to a dev value in code.
      DATABASE_URL: "file:./ci.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 (current LTS). Required by jsdom 30 → undici 8, which uses
          # worker_threads.markAsUncloneable (added in Node 22); on Node 20 the
          # test run aborts with "webidl.util.markAsUncloneable is not a function"
          # even though every test passes.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create CI database
        run: npx prisma db push --skip-generate

      - name: Type-check
        run: npm run typecheck

      - name: Unit & API tests
        run: npm test

      - name: Build
        run: npm run build
