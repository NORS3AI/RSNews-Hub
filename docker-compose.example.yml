name: rsnews-hub

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
  AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET is required}"
  SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:?SEED_ADMIN_EMAIL is required}"
  SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is required}"
  AUTH_MODE: "${AUTH_MODE:-local}"
  SITE_URL: "${SITE_URL:?SITE_URL is required}"
  UPLOAD_DIR: /data/uploads
  STORAGE_DRIVER: local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rsnews-hub:demo
    restart: unless-stopped
    environment: *app-environment
    ports:
      - 9141:3000
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Run once after the app is healthy:
  # docker compose --profile seed run --rm seed
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    image: rsnews-hub:seed
    profiles: ["seed"]
    restart: "no"
    environment: *app-environment
    command: ["npm", "run", "db:seed"]
    depends_on:
      postgres:
        condition: service_healthy